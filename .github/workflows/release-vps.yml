# Perfil VPS: construye las imágenes, las publica en GitHub Container Registry
# y (opcional) despliega por SSH. Se dispara al crear un tag vX.Y.Z o a mano.
name: Release (VPS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          target: api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }},ghcr.io/${{ github.repository }}/api:latest
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          target: web
          push: true
          build-args: VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: ghcr.io/${{ github.repository }}/web:${{ github.ref_name }},ghcr.io/${{ github.repository }}/web:latest

  deploy:
    needs: images
    # Se activa creando la variable de repo DEPLOY_ENABLED=true y los secrets VPS_*.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app
            export TAG=${{ github.ref_name }}
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
            docker image prune -f
